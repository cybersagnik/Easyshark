name: EasyShark CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m compileall -q ai cli core detect preprocessors main.py
      - run: python -m unittest discover -s tests -q
  security-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install pip-audit bandit
      - run: pip-audit -r requirements.lock
      - run: bandit -q -lll -iii -r ai cli core detect preprocessors main.py -x tests
      - run: pip-audit -r requirements.lock -f cyclonedx-json -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: easyshark-sbom
          path: sbom.json
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t easyshark:ci .
      - run: docker run --rm easyshark:ci --help
